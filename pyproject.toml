[project]
name = "autocad-mcp"
version = "3.2.0"
description = "MCP server for AutoCAD LT automation, headless DXF generation, and image → DXF tracing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.1,<2.0",
    "ezdxf>=0.18",
    "matplotlib>=3.7",
    "Pillow>=10.0.0",
    "structlog>=24.0.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "httpx>=0.27",
    "pywin32>=305; sys_platform == 'win32'",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
autocad-trace = "autocad_mcp.trace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
